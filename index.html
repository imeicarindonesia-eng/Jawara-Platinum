                const context = canvas.getContext('2d');
                const vWidth = video.videoWidth;
                const vHeight = video.videoHeight;
                const cropWidth = Math.round(vWidth * 0.70);
                const cropHeight = Math.round(vHeight * 0.40);
                const cropX = Math.round((vWidth - cropWidth) / 2);
                const cropY = Math.round((vHeight - cropHeight) / 2);
                canvas.width = cropWidth; canvas.height = cropHeight;
                context.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
                try {
                    const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
                    const firstLine = text.split('\n')[0].trim();
                    if (firstLine) {
                        let cleaned = firstLine.replace(/[^a-zA-Z0-9\s]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
                        let combined = cleaned.replace(/\s/g, '');
                        const nopolRegex = /^([A-Z]{1,2})(\d{1,4})([A-Z]{0,3})$/;
                        const match = combined.match(nopolRegex);
                        let finalResult = match ? (match[3] ? `${match[1]} ${match[2]} ${match[3]}` : `${match[1]} ${match[2]}`) : combined;
                        setPlate(finalResult); showMsg("TERDETEKSI: " + finalResult); stopCamera();
                    } else { showMsg("TEKS TIDAK JELAS"); }
                } catch (e) { showMsg("OCR GAGAL"); } finally { setIsScanning(false); }
            };

            const extractJson = (text) => {
                if (typeof text !== 'string') return text;
                try {
                    return JSON.parse(text);
                } catch (e) {
                    const startObj = text.indexOf('{');
                    const startArr = text.indexOf('[');
                    let start = -1;
                    let end = -1;
                    
                    if (startObj !== -1 && (startArr === -1 || startObj < startArr)) {
                        start = startObj;
                        end = text.lastIndexOf('}');
                    } else if (startArr !== -1) {
                        start = startArr;
                        end = text.lastIndexOf(']');
                    }
                    
                    if (start !== -1 && end !== -1 && end > start) {
                        try {
                            return JSON.parse(text.substring(start, end + 1));
                        } catch (err) {
                            try {
                                const cleaned = text.substring(start, end + 1)
                                    .replace(/\\"/g, '"')
                                    .replace(/\\\\/g, '\\');
                                return JSON.parse(cleaned);
                            } catch (err2) {
                                return null;
                            }
                        }
                    }
                }
                return null;
            };

            const unifyAndExtractVehicleData = (rawText) => {
                if (!rawText) return null;
                let parsed = null;
                if (typeof rawText === 'object') {
                    parsed = rawText;
                } else {
                    try { parsed = JSON.parse(rawText); } catch (e) { parsed = extractJson(rawText); }
                }
                if (!parsed) return null;
                if (parsed.contents) {
                    let inner = null;
                    if (typeof parsed.contents === 'string') {
                        try { inner = JSON.parse(parsed.contents); } catch (e) { inner = extractJson(parsed.contents); }
                    } else { inner = parsed.contents; }
                    if (inner) parsed = inner;
                }
                const findVehicleObject = (obj) => {
                    if (!obj || typeof obj !== 'object') return null;
                    if (Array.isArray(obj)) {
                        for (let item of obj) { const found = findVehicleObject(item); if (found) return found; }
                        return null;
                    }
                    if (obj.data && typeof obj.data === 'object') {
                        const found = findVehicleObject(obj.data); if (found) return found;
                    }
                    const vehicleKeys = ['nopol', 'nama', 'NamaPemilik', 'NoRangka', 'no_rangka', 'NoMesin', 'no_mesin', 'NoSTNK', 'no_stnk', 'NoBPKB', 'no_bpkb', 'wilayah', 'seri', 'ktp', 'NoKTP', 'type', 'merk'];
                    let matchCount = 0;
                    for (let key of vehicleKeys) { if (obj[key] !== undefined && obj[key] !== null && String(obj[key]).trim() !== '') matchCount++; }
                    if (matchCount >= 2) return obj;
                    for (let k in obj) {
                        if (obj.hasOwnProperty(k) && obj[k] && typeof obj[k] === 'object') {
                            const found = findVehicleObject(obj[k]); if (found) return found;
                        }
                    }
                    return null;
                };
                return findVehicleObject(parsed);
            };

            const handleSearchPress = (e) => {
                if (e) { e.preventDefault(); e.stopPropagation(); }

            const cariDataFirebaseMultiField = async (searchQuery) => {
                if (!db || !searchQuery) return null;

                const queryClean = searchQuery.replace(/\s+/g, '').toUpperCase();

                try {
                    const collectionRef = db.collection('pencarian');

                    const docSnap = await collectionRef.doc(queryClean).get().catch(() => null);
                    if (docSnap && docSnap.exists) {
                        return docSnap.data();
                    }

                    const targetFields = [
                        'nopol', 'Nopol', 'no_polisi', 'NopolServer',
                        'no_rangka', 'NoRangka', 'noka', 'vin', 'no_frame',
                        'no_mesin', 'NoMesin', 'nosin', 'no_engine',
                        'ktp', 'nik', 'NIK', 'NoKTP', 'no_ktp', 'identitas', 'no_identitas',
                        'nama', 'NamaPemilik', 'nama_pemilik', 'Nama', 'nm_pmlk', 
                        'mssdn', 'MSSDN', 'no_hp', 'NoHP', 'nomor_hp', 'telepon'
                    ];

                    return await new Promise((resolve) => {
                        let pending = targetFields.length;
                        let found = false;

                        if (pending === 0) return resolve(null);

                        targetFields.forEach((fieldName) => {
                            collectionRef.where(fieldName, "==", queryClean).limit(1).get()
                                .then((snap) => {
                                    if (found) return;
                                    if (!snap.empty) {
                                        found = true;
                                        resolve(snap.docs[0].data());
                                    } else {
                                        pending--;
                                        if (pending === 0 && !found) resolve(null);
                                    }
                                })
                                .catch(() => {
                                    if (found) return;
                                    pending--;
                                    if (pending === 0 && !found) resolve(null);
                                });
                        });
                    });
                } catch (error) {
                    console.warn("Pencarian Multi-Field Firebase Error:", error);
                    return null;

                const finalizeSuccess = (data) => {
                    if (resolved) return;
                    resolved = true;
                    controllers.forEach(ctrl => { try { ctrl.abort(); } catch(e) {} });
                    try { sessionStorage.setItem(cleanQuery, JSON.stringify(data)); } catch (e) {}
                    incrementDailyCount();
                    setSearchResult(data);
                    setCurrentPage('result');
                    setLoading(false);
                    showMsg("DATA DITEMUKAN");

                const baseUrls = [
                  `${customApi1 || API_UTAMA_1}${encodeURIComponent(cleanQuery)}`,
                  `${customApi2 || API_UTAMA_2}${encodeURIComponent(cleanQuery)}`,
                  `${customApi3 || API_UTAMA_3}${encodeURIComponent(cleanQuery)}`
                ];

                const requestPool = [];
                baseUrls.forEach(baseUrl => {
                    requestPool.push({ url: baseUrl });
                    requestPool.push({ url: `https://api.allorigins.win/raw?url=${encodeURIComponent(baseUrl)}` });
                    requestPool.push({ url: `https://corsproxy.io/?${encodeURIComponent(baseUrl)}` });
                    requestPool.push({ url: `https://allorigins.hexschool.workers.dev/raw?url=${encodeURIComponent(baseUrl)}` });
                    requestPool.push({ url: `https://api.allorigins.win/get?url=${encodeURIComponent(baseUrl)}` });
                    requestPool.push({ url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(baseUrl)}` });
                });

                let pendingCount = requestPool.length;

                requestPool.forEach((targetObj) => {
                    const ctrl = new AbortController();
                    controllers.push(ctrl);
                    const timerId = setTimeout(() => ctrl.abort(), 12000); 

                    fetch(targetObj.url, { signal: ctrl.signal })
                        .then(async (res) => {
                            clearTimeout(timerId);
                            if (resolved || !res.ok) throw new Error("HTTP error");
                            const text = await res.text();
                            const vehicleData = unifyAndExtractVehicleData(text);
                            if (vehicleData && !resolved) {

                                        ...vehicleData,
                                        waktu_ditemukan: new Date()
                                    }, { merge: true }).catch(() => {});
                                }
                                finalizeSuccess(vehicleData);
                            } else {
                                throw new Error("No vehicle data");
                            }
                        })
                        .catch(() => {
                            clearTimeout(timerId);
                            pendingCount--;
                            if (pendingCount === 0 && !resolved) {
                                setTimeout(() => {
                                    if (!resolved) {
                                        setLoading(false);
                                        showMsg("");
                                    }
                                }, 500);
                            }
                        });
                });
            };

                    default: return "-";

            const copyToClipboard = (text) => {

                try { if (document.execCommand('copy')) showMsg("LAPORAN DISALIN"); } catch (err) { showMsg("GAGAL SALIN"); } document.body.removeChild(el);

                                        </div>

                                        <div className="glass-panel p-6 rounded-[2.5rem] border-white/10">
                                            <textarea value={broadcast} onChange={e => setBroadcast(e.target.value)} className="w-full bg-black/50 border border-white/10 rounded-2xl p-5 text-xs text-white outline-none h-24 mb-4 font-mono-custom focus:border-white/50 transition-all" />
                                            <button type="button" onClick={async () => { if (!db) return; await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_SETTINGS).doc('main').set({ text: broadcast }, { merge: true }); showMsg("TEXT DIPERBARUI"); }} className="w-full bg-white text-black py-4 rounded-2xl font-black text-xs uppercase shadow-xl outline-none hover:bg-slate-200">UPDATE RUNNING TEXT</button>
                                        </div>
                                    </>
                                )}

                                <div className="flex gap-3">
                                    <input 
                                        type="text" 
                                        placeholder="MASUKKAN / CARI ID PIN..." 
                                        value={searchTerm} 
                                        onChange={e => setSearchTerm(e.target.value)} 
                                        className="flex-1 bg-[#0d121f] border border-white/10 rounded-2xl px-6 py-4 text-xs text-white outline-none font-bold placeholder:text-slate-500" 
                                    />
                                    {isAdminRole(userRole) && (
                                        <button type="button" onClick={() => setShowAddPinModal(true)} className="w-14 h-14 bg-white text-black rounded-2xl shadow-lg active:scale-95 outline-none flex items-center justify-center shrink-0 hover:bg-slate-200"><Icons.Plus cls="w-7 h-7" /></button>
                                    )}
                                </div>

                                {searchTerm.trim() === '' ? (
                                    <div className="bg-[#080b11] border border-white/10 p-8 rounded-[2.5rem] text-center my-4 shadow-xl">
                                        <p className="text-white font-black text-base uppercase tracking-wider mb-3">PENCARIAN ID PIN</p>
                                        <p className="text-slate-300 text-xs font-semibold leading-relaxed max-w-[280px] mx-auto">
                                            Ketik ID PIN user pada kolom pencarian di atas untuk memproses Aktivasi atau Perpanjangan Masa Aktif.
                                        </p>
                                    </div>
                                ) : (
                                    <div className="space-y-4">
                                        {managedPins.filter(p => p.id.includes(searchTerm)).map(p => {
                                            const isUserActive = !p.isBlocked && (p.expiry === 'UNLIMITED' || p.expiry > Date.now());
                                            
                                            if (userRole !== 'master') {
                                                return (
                                                    <div key={p.id} className="bg-[#0b0c0e] border border-white/10 p-6 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                                                        <div className="flex justify-between items-start mb-1">
                                                            <p className="text-5xl font-black text-white font-mono-custom tracking-tighter">{p.id}</p>
                                                            <span className={`px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider ${isUserActive ? 'bg-white/20 text-white border border-white/40' : 'bg-zinc-800 text-slate-300 border border-white/10'}`}>
                                                                {isUserActive ? 'ACTIVE' : 'INACTIVE'}
                                                            </span>
                                                        </div>
                                                        <p className="text-slate-200 font-black text-xs uppercase tracking-wide mb-1">
                                                            EXP: {p.expiry === 'UNLIMITED' ? 'PERMANEN' : new Date(p.expiry).toLocaleDateString('id-ID')}
                                                        </p>
                                                        <p className="text-[10px] text-slate-400 font-mono-custom font-bold uppercase mb-6">
                                                            DEVICE: {p.deviceId ? p.deviceId.substring(0,12)+'...' : 'BEBAS HP'}
                                                        </p>

                                                        <button 
                                                            type="button" 
                                                            onClick={() => setDurationModal(p)} 
                                                            className="w-full bg-white text-black font-black py-4 rounded-2xl text-xs uppercase tracking-widest active:scale-98 transition-all shadow-lg hover:bg-slate-200"
                                                        >
                                                            PERPANJANG MASA AKTIF
                                                        </button>
                                                    </div>
                                                );
                                            }

                                            return (
                                                <div key={p.id} className="glass-panel p-6 rounded-[2.5rem] border-white/10 shadow-lg relative overflow-hidden">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div>
                                                            <p className="text-4xl font-black text-white font-mono-custom tracking-tighter">{p.id}</p>
                                                            <p className={`text-[11px] font-bold uppercase mt-1 ${isUserActive ? 'text-white' : 'text-slate-400'}`}>
                                                                EXP: {p.expiry === 'UNLIMITED' ? 'NOLIMIT' : new Date(p.expiry).toLocaleDateString()}
                                                            </p>
                                                            <p className="text-[9px] text-slate-400 font-bold mt-1 uppercase">
                                                                DEVICE: {p.deviceId ? p.deviceId.substring(0,10)+'...' : 'BEBAS HP'}
                                                            </p>
                                                            {p.petugas_name && (
                                                                <p className="text-[9px] text-slate-300 font-bold mt-1 uppercase">
                                                                    PETUGAS: {p.petugas_name}
                                                                </p>
                                                            )}
                                                        </div>
                                                        <span className={`px-4 py-1.5 rounded-full text-[9px] font-black uppercase ${isUserActive ? 'bg-white/20 text-white border border-white/30' : 'bg-zinc-800 text-slate-400 border border-white/10'}`}>
                                                            {isUserActive ? 'ACTIVE' : 'INACTIVE'}
                                                        </span>
                                                    </div>
                                                    
                                                    <div className="flex gap-2 mt-6">
                                                        <button 
                                                            type="button" 
                                                            onClick={async () => { 
                                                                if (!db) return;
                                                                await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_PINS).doc(p.id).update({ isBlocked: !p.isBlocked }); 
                                                                showMsg("STATUS BLOKIR DIPERBARUI"); 
                                                            }} 
                                                            className="flex-1 bg-slate-900 border border-white/10 text-white py-4 rounded-2xl text-[9px] font-black uppercase outline-none"
                                                        >
                                                            {p.isBlocked ? 'BATAL BLOK' : 'BLOKIR'}
                                                        </button>

                                                        {(p.isBlocked || (p.expiry !== 'UNLIMITED' && p.expiry <= Date.now())) && (
                                                            <button 
                                                                type="button" 
                                                                onClick={async () => { 
                                                                    if (!db) return;
                                                                    await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_PINS).doc(p.id).update({ 
                                                                        isBlocked: false,
                                                                        activated_by: userRole,
                                                                        petugas_name: currentAdminName,
                                                                        activated_at: Date.now()
                                                                    }); 
                                                                    showMsg(`ID BERHASIL DIAKTIFKAN`); 
                                                                }} 
                                                                className="flex-1 bg-white text-black py-4 rounded-2xl text-[9px] font-black uppercase outline-none shadow-md"
                                                            >
                                                                AKTIFKAN ID
                                                            </button>
                                                        )}
                                                        
                                                        <button 
                                                            type="button" 
                                                            onClick={() => setDurationModal(p)} 
                                                            className="flex-1 bg-zinc-800 border border-white/20 text-white py-4 rounded-2xl text-[9px] font-black uppercase outline-none"
                                                        >
                                                            PERPANJANG MASA AKTIF
                                                        </button>
                                                        
                                                        <button 
                                                            type="button" 
                                                            onClick={() => { 
                                                                setConfirmModal({ 
                                                                    message: `Reset link HP ID ${p.id}?`, 
                                                                    onConfirm: async () => { 
                                                                        if (db) await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_PINS).doc(p.id).update({ deviceId: null }); 
                                                                        showMsg("RESET HP BERHASIL"); 
                                                                        setConfirmModal(null); 
                                                                    } 
                                                                }); 
                                                            }} 
                                                            className="flex-1 bg-slate-900 border border-white/10 text-slate-300 py-4 rounded-2xl text-[9px] font-black uppercase outline-none"
                                                        >
                                                            RESET HW
                                                        </button>
                                                    </div>

                                                    <button 
                                                        type="button" 
                                                        onClick={() => { 
                                                            setConfirmModal({ 
                                                                message: `Hapus PIN ${p.id}?`, 
                                                                onConfirm: async () => { 
                                                                    if (db) await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_PINS).doc(p.id).delete(); 
                                                                    showMsg("PIN DIHAPUS"); 
                                                                    setConfirmModal(null); 
                                                                } 
                                                            }); 
                                                        }} 
                                                        className="w-full mt-2 bg-zinc-900 hover:bg-zinc-800 text-slate-300 py-3.5 rounded-2xl text-[9px] font-black uppercase flex items-center justify-center gap-2 border border-white/10 outline-none"
                                                    >
                                                        HAPUS PERMANEN
                                                    </button>
                                                </div>
                                            );
                                        })}
                                        {managedPins.filter(p => p.id.includes(searchTerm)).length === 0 && (
                                            <div className="glass-panel p-6 rounded-[2.5rem] border-white/10 text-center text-slate-400 text-xs font-bold">
                                                ID PIN "{searchTerm}" TIDAK DITEMUKAN
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {}
                    {cameraActive && (
                        <div className="absolute inset-0 bg-black z-[2000] flex flex-col overflow-hidden">
                            <video ref={videoRef} autoPlay playsInline className="absolute inset-0 w-full h-full object-cover z-0" />
                            <canvas ref={canvasRef} className="hidden" />
                            <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-10"><div className="w-80 h-40 scan-guide rounded-3xl" /><div className="absolute top-[18%] text-center text-[10px] font-black uppercase tracking-[0.2em] text-white bg-black/80 px-5 py-2.5 rounded-full border border-white/30 shadow-lg">POSISIKAN PLAT NOMOR DI DALAM KOTAK</div></div>
                            <div className="absolute bottom-8 left-6 right-6 z-20 flex items-center justify-between gap-4 bg-black/60 backdrop-blur-md p-5 rounded-[2rem] border border-white/20 shadow-2xl"><button type="button" onClick={stopCamera} className="p-5 bg-zinc-900 rounded-2xl text-white outline-none border border-white/10"><Icons.X /></button><button type="button" onClick={captureAndProcess} disabled={isScanning} className="flex-1 bg-white text-black font-black py-5 rounded-2xl uppercase flex items-center justify-center gap-3 active:scale-95 transition-all shadow-xl outline-none hover:bg-slate-200">{isScanning ? <div className="w-5 h-5 border-2 border-black/20 border-t-black rounded-full animate-spin" /> : <Icons.Camera cls="w-5 h-5 text-black" />}{isScanning ? 'MENDETEKSI...' : 'AMBIL FOTO PLAT'}</button></div>
                        </div>
                    )}

                    {showPinModal && (
                        <div className="absolute inset-0 bg-black/95 backdrop-blur-3xl z-[2000] flex items-center justify-center p-8">
                            <div className="glass-panel w-full max-w-[340px] rounded-[3.5rem] border-white/20 p-10 text-center shadow-2xl">
                                <h3 className="text-white font-black text-[12px] uppercase mb-8 tracking-[0.3em] opacity-90">ADMIN OTORISASI</h3>
                                <input autoFocus type="password" value={pinInput} onChange={e => setPinInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleMasterLogin()} placeholder="PIN" className="w-full bg-zinc-900 border border-white/30 rounded-3xl p-5 text-center text-4xl font-black text-white outline-none mb-8 font-mono-custom tracking-tighter shadow-inner placeholder:text-zinc-600" />
                                <div className="flex gap-4">
                                    <button type="button" onClick={() => setShowPinModal(false)} className="flex-1 py-4 bg-zinc-800 border border-white/10 text-white rounded-2xl font-black text-[11px] uppercase tracking-widest outline-none">BATAL</button>
                                    <button type="button" onClick={handleMasterLogin} className="flex-1 py-4 bg-white text-black rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-lg active:scale-95 outline-none">MASUK</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {confirmModal && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-md z-[9999] flex items-center justify-center p-6">
                            <div className="glass-panel w-full max-w-[320px] rounded-[2.5rem] border-white/20 p-10 text-center shadow-2xl">
                                <p className="text-white font-black text-xl mb-8 leading-tight tracking-tight">{confirmModal.message}</p>
                                <div className="flex gap-4">
                                    <button type="button" onClick={() => setConfirmModal(null)} className="flex-1 py-4 bg-zinc-800 border border-white/10 text-white rounded-2xl font-black text-[11px] uppercase tracking-widest outline-none">BATAL</button>
                                    <button type="button" onClick={confirmModal.onConfirm} className="flex-1 py-4 bg-white text-black rounded-2xl font-black text-[11px] uppercase tracking-widest shadow-lg outline-none">YA, PROSES</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAddPinModal && (
                        <div className="absolute inset-0 bg-black/90 backdrop-blur-2xl z-[1000] flex items-center justify-center p-6">
                            <div className="glass-panel w-full max-w-[380px] rounded-[3rem] p-10 border-white/20 shadow-2xl flex flex-col">
                                <p className="text-white font-black uppercase text-xs mb-6 text-center tracking-widest opacity-80">TAMBAH ID PIN USER BARU</p>
                                <input type="number" value={newPinInput} onChange={e => setNewPinInput(e.target.value)} placeholder="000000" className="w-full bg-black border border-white/20 rounded-3xl p-6 text-white font-black text-4xl text-center mb-6 font-mono-custom tracking-widest" />
                                <div className="grid grid-cols-3 gap-2 mb-8 max-h-[160px] overflow-y-auto pr-1 scrollbar-hide border border-white/10 p-2 rounded-2xl bg-black/40">
                                    {durationOptions.map(opt => (
                                        <button type="button" key={opt.l} onClick={() => setNewPinDuration(opt.v)} className={`py-4 rounded-xl text-[9px] font-black uppercase transition-all ${newPinDuration === opt.v ? 'bg-white text-black font-black' : 'bg-slate-900 text-slate-400'}`}>{opt.l}</button>
                                    ))}
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setShowAddPinModal(false)} className="flex-1 py-5 bg-zinc-800 border border-white/10 text-white rounded-2xl font-black text-[11px] uppercase outline-none">BATAL</button>
                                    <button type="button" onClick={async () => {
                                        if (!db || !newPinInput) return;
                                        await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_PINS).doc(newPinInput).set({
                                            expiry: newPinDuration === 'UNLIMITED' ? 'UNLIMITED' : Date.now() + newPinDuration,
                                            isBlocked: false,
                                            role: 'user',
                                            deviceId: null,
                                            created_by: userRole,
                                            activated_by: userRole,
                                            petugas_name: currentAdminName,
                                            activated_at: Date.now()
                                        });
                                        setShowAddPinModal(false);
                                        setNewPinInput('');
                                        showMsg("PIN BERHASIL DIBUAT");
                                    }} className="flex-1 py-5 bg-white text-black rounded-2xl font-black text-[11px] uppercase shadow-lg outline-none hover:bg-slate-200">SIMPAN PIN</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {durationModal && (
                        <div className="absolute inset-0 bg-black/90 backdrop-blur-xl z-[500] flex items-center justify-center p-6">
                            <div className="glass-panel w-full max-w-[360px] rounded-[3rem] p-10 border-white/20 shadow-2xl flex flex-col">
                                <p className="text-white font-black uppercase text-xs mb-8 text-center tracking-[0.2em]">PERPANJANG MASA AKTIF: {durationModal.id}</p>
                                <div className="grid grid-cols-2 gap-3 max-h-[300px] overflow-y-auto pr-2 scrollbar-hide">
                                    {durationOptions.map(opt => (
                                        <button 
                                            type="button" 
                                            key={opt.l} 
                                            onClick={async () => { 
                                                if (!db) return; 
                                                let currentExp = (durationModal.expiry === 'UNLIMITED' || durationModal.expiry < Date.now()) ? Date.now() : durationModal.expiry; 
                                                await db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(COLLECTION_PINS).doc(durationModal.id).update({ 
                                                    expiry: opt.v === 'UNLIMITED' ? 'UNLIMITED' : currentExp + opt.v, 
                                                    activated_by: userRole, 
                                                    petugas_name: currentAdminName, 
                                                    activated_at: Date.now() 
                                                }); 
                                                setDurationModal(null); 
                                                showMsg(`MASA AKTIF DITAMBAH OLEH ${currentAdminName.toUpperCase()}`); 
                                            }} 
                                            className="bg-zinc-900 border border-white/10 text-white py-4 rounded-2xl text-[10px] font-black uppercase hover:bg-white hover:text-black transition-colors outline-none"
                                        >
                                            {opt.l}
                                        </button>
                                    ))}
                                </div>
                                <button type="button" onClick={() => setDurationModal(null)} className="w-full mt-8 py-4 text-slate-400 font-black text-[11px] uppercase tracking-widest outline-none">DISMISS</button>
                            </div>
                        </div>
                    )}

                    {notification && (
                        <div className="fixed top-12 left-1/2 -translate-x-1/2 z-[9999] flex items-center justify-center p-4 pointer-events-none w-full">
                            <div className="bg-white text-black px-8 py-4 rounded-[2rem] font-black text-xs shadow-[0_10px_40px_rgba(255,255,255,0.4)] animate-bounce uppercase border-2 border-slate-200 text-center max-w-[90vw] leading-relaxed tracking-wider pointer-events-auto">
                                {notification}
                            </div>
                        </div>
                    )}
                    
                    {loading && (
                        <div className="fixed inset-0 bg-black/95 backdrop-blur-2xl z-[9000] flex items-center justify-center">
                            <div className="flex flex-col items-center">
                                <svg className="animate-spin w-14 h-14 text-white mb-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect x="11" y="1.5" width="2" height="5" rx="1" fill="currentColor" opacity="1.0" />
                                    <rect x="11" y="1.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.875" transform="rotate(45 12 12)" />
                                    <rect x="11" y="1.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.75" transform="rotate(90 12 12)" />
                                    <rect x="11" y="1.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.625" transform="rotate(135 12 12)" />
                                    <rect x="11" y="1.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.5" transform="rotate(180 12 12)" />
                                    <rect x="11" y="1.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.375" transform="rotate(225 12 12)" />
                                    <rect x="11" y="1.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.25" transform="rotate(270 12 12)" />
                                    <rect x="11" y="1.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.125" transform="rotate(315 12 12)" />
                                </svg>
                                <p className="text-white font-black uppercase text-[10px] tracking-[0.5em] animate-pulse">MEMPROSES DATA</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch(err) {
            console.error("Mount error:", err);
        }
    </script>
</body>
</html>
